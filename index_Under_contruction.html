<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Under Construction - Peerona Clinic</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
            overflow: hidden;
            text-align: center;
        }

        .image-container {
            width: 100%;
            max-height: 350px;
            overflow: hidden;
        }

        .image-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        .content {
            padding: 40px 30px;
        }

        h1 {
            color: #2c3e50;
            font-size: 28px;
            margin-bottom: 15px;
        }

        p {
            color: #7f8c8d;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .footer {
            color: #95a5a6;
            font-size: 14px;
            border-top: 1px solid #ecf0f1;
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="image-container">
            <img src="./watermarked_img_16192294696748133401.jpg" alt="Worker repairing a road for Peerona Clinic">
        </div>
        <div class="content">
            <h1>We're Launching Soon!</h1>
            <p>Our website is currently undergoing scheduled maintenance or being built. We are working hard to give you the best experience possible. Stay tuned!</p>
            
            <div class="footer">
                &copy; 2026 Peerona Clinic. All rights reserved.
            </div>
        </div>
    </div>

</body>
</html>
