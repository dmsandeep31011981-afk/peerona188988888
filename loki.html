<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peerona's Dr.Lokesh Page</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#127807;</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/loki.css">
</head>
<body class="loki-page">

<!-- ===== Passcode gate ===== -->
<div class="loki-gate" id="lokiGate">
  <div class="loki-gate-box">
    <div class="loki-gate-icon" aria-hidden="true">&#128272;</div>
    <h1>Dr.Lokesh/Management &mdash; Private Access</h1>
    <p class="modal-sub">Enter the passcode to view appointments and messages.</p>
    <form id="lokiGateForm" class="message-form" autocomplete="off">
      <div class="form-saving-overlay" id="lokiGateSavingOverlay"><span class="loki-spinner"></span></div>
      <label for="lokiPasscodeInput">Passcode</label>
      <input type="password" id="lokiPasscodeInput" name="passcode" placeholder="Enter passcode" required autofocus>
      <button type="submit" class="btn btn-primary btn-block btn-lg">Enter</button>
      <p class="form-status" id="lokiGateStatus" aria-live="polite"></p>
    </form>
  </div>
</div>

<!-- ===== Main app (hidden until passcode verified) ===== -->
<div class="loki-app" id="lokiApp" hidden>

  <header class="loki-header">
    <div class="container loki-header-inner">
      <div class="brand">
        <span class="logo">Pee<span>rOna</span></span>
        <span class="brand-tagline">Dr. Lokesh &mdash; Appointments &amp; Messages</span>
      </div>
      <button type="button" class="btn btn-outline loki-lock-btn" id="lokiLockBtn"><i data-icon="x"></i> <span id="lokiLockLabel">Logout</span></button>
    </div>
  </header>

  <main class="container loki-main">

    <!-- ===== Appointment Section ===== -->
    <section class="loki-section" id="apptSection">
      <button type="button" class="loki-section-toggle" id="apptToggle" aria-expanded="false">
        <i data-icon="calendar"></i>
        <span>Appointment Section</span>
        <i data-icon="arrow-up" class="loki-chevron"></i>
      </button>

      <div class="loki-section-body" id="apptBody" hidden>
        <div class="form-saving-overlay" id="apptSavingOverlay"><span class="loki-spinner"></span></div>
        <div class="loki-nav">
          <button type="button" class="btn btn-outline loki-nav-btn" id="apptPrevBtn">&larr; Earlier</button>
          <span class="loki-nav-label" id="apptRangeLabel">&mdash;</span>
          <button type="button" class="btn btn-outline loki-nav-btn" id="apptTodayBtn">Today</button>
          <button type="button" class="btn btn-outline loki-nav-btn" id="apptNextBtn">Later &rarr;</button>
          <button type="button" class="loki-refresh-btn" id="apptRefreshBtn" title="Refresh" aria-label="Refresh appointments"><i data-icon="refresh"></i></button>
        </div>

        <p class="form-status" id="apptStatus" aria-live="polite"></p>
        <div class="loki-list" id="apptList"></div>

        <div class="loki-save-bar" id="apptSaveBar" hidden>
          <span id="apptSaveCount"></span>
          <button type="button" class="btn btn-primary" id="apptSaveBtn">Save Changes</button>
        </div>
      </div>
    </section>

    <!-- ===== Messages Section ===== -->
    <section class="loki-section" id="msgSection">
      <button type="button" class="loki-section-toggle" id="msgToggle" aria-expanded="false">
        <i data-icon="message-circle"></i>
        <span>Messages Section</span>
        <i data-icon="arrow-up" class="loki-chevron"></i>
      </button>

      <div class="loki-section-body" id="msgBody" hidden>
        <div class="loki-nav">
          <button type="button" class="btn btn-outline loki-nav-btn" id="msgPrevBtn">&larr; Earlier</button>
          <span class="loki-nav-label" id="msgRangeLabel">&mdash;</span>
          <button type="button" class="btn btn-outline loki-nav-btn" id="msgTodayBtn">Today</button>
          <button type="button" class="btn btn-outline loki-nav-btn" id="msgNextBtn">Later &rarr;</button>
          <button type="button" class="loki-refresh-btn" id="msgRefreshBtn" title="Refresh" aria-label="Refresh messages"><i data-icon="refresh"></i></button>
        </div>

        <p class="form-status" id="msgStatus" aria-live="polite"></p>
        <div class="loki-list" id="msgList"></div>
      </div>
    </section>

    <!-- ===== Cancel Dates Section ===== -->
    <section class="loki-section" id="cancelSection">
      <button type="button" class="loki-section-toggle" id="cancelToggle" aria-expanded="false">
        <i data-icon="x-circle"></i>
        <span>Cancel Dates</span>
        <i data-icon="arrow-up" class="loki-chevron"></i>
      </button>

      <div class="loki-section-body" id="cancelBody" hidden>
        <div class="loki-subtabs">
          <button type="button" class="loki-subtab-btn is-active" id="cancelAllTabBtn">All Bookings</button>
          <button type="button" class="loki-subtab-btn" id="cancelRangeTabBtn">By Date Range</button>
          <button type="button" class="loki-refresh-btn" id="cancelRefreshBtn" title="Refresh" aria-label="Refresh bookings"><i data-icon="refresh"></i></button>
        </div>

        <!-- All Bookings sub-view -->
        <div class="loki-subtab-panel" id="cancelAllPanel">
          <p class="form-status" id="cancelAllStatus" aria-live="polite"></p>
          <div class="loki-cancel-selectbar">
            <label class="loki-checkbox-label">
              <input type="checkbox" id="cancelAllSelectAll"> Select all
            </label>
            <span id="cancelAllSelectedCount">0 selected</span>
          </div>
          <div class="loki-list" id="cancelAllList"></div>
          <div class="loki-save-bar" id="cancelAllSaveBar" hidden>
            <div class="loki-reason-field">
              <label for="cancelAllReasonSelect">Cancelled Reason (optional, applies to all selected)</label>
              <select id="cancelAllReasonSelect"></select>
            </div>
            <button type="button" class="btn btn-primary" id="cancelAllSaveBtn">Cancel Selected</button>
          </div>
        </div>

        <!-- Date Range sub-view -->
        <div class="loki-subtab-panel" id="cancelRangePanel" hidden>
          <div class="loki-range-fields">
            <label>Start date <input type="date" id="cancelRangeStart"></label>
            <label>End date <input type="date" id="cancelRangeEnd"></label>
            <button type="button" class="btn btn-outline" id="cancelRangeLoadBtn">Show Bookings</button>
          </div>
          <p class="form-status" id="cancelRangeStatus" aria-live="polite"></p>
          <div class="loki-cancel-selectbar" id="cancelRangeSelectbar" hidden>
            <label class="loki-checkbox-label">
              <input type="checkbox" id="cancelRangeSelectAll"> Select all
            </label>
            <span id="cancelRangeSelectedCount">0 selected</span>
          </div>
          <div class="loki-list" id="cancelRangeList"></div>
          <div class="loki-save-bar" id="cancelRangeSaveBar" hidden>
            <div class="loki-reason-field">
              <label for="cancelRangeReasonSelect">Cancelled Reason (optional, applies to all selected)</label>
              <select id="cancelRangeReasonSelect"></select>
            </div>
            <button type="button" class="btn btn-primary" id="cancelRangeSaveBtn">Cancel Selected</button>
          </div>
        </div>
      </div>
    </section>

  </main>
</div>

<!-- ===== Photos modal ===== -->
<div class="modal-overlay" id="photosModalOverlay">
  <div class="modal-box loki-photos-box">
    <button type="button" class="modal-close" id="closePhotosModal" aria-label="Close"><i data-icon="x"></i></button>
    <h3>Photos</h3>
    <p class="modal-sub">Uploaded with this message.</p>
    <div class="modal-scroll-content loki-photos-scroll" id="photosScroll"></div>
  </div>
</div>

<!-- ===== Reply modal ===== -->
<div class="modal-overlay" id="replyModalOverlay">
  <div class="modal-box">
    <button type="button" class="modal-close" id="closeReplyModal" aria-label="Close"><i data-icon="x"></i></button>
    <h3>Reply to message</h3>
    <p class="modal-sub" id="replyModalSub">&mdash;</p>
    <form id="replyForm" class="message-form">
      <label for="replyTextarea">Your reply</label>
      <textarea id="replyTextarea" rows="10" placeholder="Type your reply here (up to about 1000 words)..."></textarea>
      <span class="form-hint" id="replyWordCount">0 / 1000 words</span>
      <button type="submit" class="btn btn-primary btn-block btn-lg">Send Reply</button>
      <p class="form-status" id="replyFormStatus" aria-live="polite"></p>
    </form>
  </div>
</div>

<!-- ===== Prescription modal ===== -->
<div class="modal-overlay" id="prescriptionModalOverlay">
  <div class="modal-box">
    <button type="button" class="modal-close" id="closePrescriptionModal" aria-label="Close"><i data-icon="x"></i></button>
    <h3>Prescription</h3>
    <p class="modal-sub" id="prescriptionModalSub">&mdash;</p>
    <form id="prescriptionForm" class="message-form">
      <label for="prescriptionTextarea">Prescription notes</label>
      <textarea id="prescriptionTextarea" rows="12" placeholder="Type the prescription / notes here (up to about 1000 words)..."></textarea>
      <span class="form-hint" id="prescriptionWordCount">0 / 1000 words</span>
      <button type="submit" class="btn btn-primary btn-block btn-lg">Save Prescription</button>
      <p class="form-status" id="prescriptionFormStatus" aria-live="polite"></p>
    </form>
  </div>
</div>

<script src="assets/js/loki.js"></script>
</body>
</html>
