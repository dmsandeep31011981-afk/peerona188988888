<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peerona's Dr.Lokesh Page</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#127807;</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/loki.css">
</head>
<body class="loki-page">

<!-- ===== Passcode gate ===== -->
<div class="loki-gate" id="lokiGate">
  <div class="loki-gate-box">
    <div class="loki-gate-icon" aria-hidden="true">&#128272;</div>
    <h1>Dr. Lokesh &mdash; Private Access</h1>
    <p class="modal-sub">Enter the passcode to view appointments and messages.</p>
    <form id="lokiGateForm" class="message-form" autocomplete="off">
      <label for="lokiPasscodeInput">Passcode</label>
      <input type="password" id="lokiPasscodeInput" name="passcode" placeholder="Enter passcode" required autofocus>
      <button type="submit" class="btn btn-primary btn-block btn-lg">Enter</button>
      <p class="form-status" id="lokiGateStatus" aria-live="polite"></p>
    </form>
  </div>
</div>

<!-- ===== Main app (hidden until passcode verified) ===== -->
<div class="loki-app" id="lokiApp" hidden>

  <header class="loki-header">
    <div class="container loki-header-inner">
      <div class="brand">
        <span class="logo">Pee<span>rOna</span></span>
        <span class="brand-tagline">Dr. Lokesh &mdash; Appointments &amp; Messages</span>
      </div>
      <button type="button" class="btn btn-outline loki-lock-btn" id="lokiLockBtn"><i data-icon="x"></i> Lock</button>
    </div>
  </header>

  <main class="container loki-main">

    <!-- ===== Appointment Section ===== -->
    <section class="loki-section" id="apptSection">
      <button type="button" class="loki-section-toggle" id="apptToggle" aria-expanded="false">
        <i data-icon="calendar"></i>
        <span>Appointment Section</span>
        <i data-icon="arrow-up" class="loki-chevron"></i>
      </button>

      <div class="loki-section-body" id="apptBody" hidden>
        <div class="loki-nav">
          <button type="button" class="btn btn-outline loki-nav-btn" id="apptPrevBtn">&larr; Earlier</button>
          <span class="loki-nav-label" id="apptRangeLabel">&mdash;</span>
          <button type="button" class="btn btn-outline loki-nav-btn" id="apptTodayBtn">Today</button>
          <button type="button" class="btn btn-outline loki-nav-btn" id="apptNextBtn">Later &rarr;</button>
        </div>

        <p class="form-status" id="apptStatus" aria-live="polite"></p>
        <div class="loki-list" id="apptList"></div>

        <div class="loki-save-bar" id="apptSaveBar" hidden>
          <span id="apptSaveCount"></span>
          <button type="button" class="btn btn-primary" id="apptSaveBtn">Save Changes</button>
        </div>
      </div>
    </section>

    <!-- ===== Messages Section ===== -->
    <section class="loki-section" id="msgSection">
      <button type="button" class="loki-section-toggle" id="msgToggle" aria-expanded="false">
        <i data-icon="message-circle"></i>
        <span>Messages Section</span>
        <i data-icon="arrow-up" class="loki-chevron"></i>
      </button>

      <div class="loki-section-body" id="msgBody" hidden>
        <div class="loki-nav">
          <button type="button" class="btn btn-outline loki-nav-btn" id="msgPrevBtn">&larr; Earlier</button>
          <span class="loki-nav-label" id="msgRangeLabel">&mdash;</span>
          <button type="button" class="btn btn-outline loki-nav-btn" id="msgTodayBtn">Today</button>
          <button type="button" class="btn btn-outline loki-nav-btn" id="msgNextBtn">Later &rarr;</button>
        </div>

        <p class="form-status" id="msgStatus" aria-live="polite"></p>
        <div class="loki-list" id="msgList"></div>
      </div>
    </section>

  </main>
</div>

<!-- ===== Photos modal ===== -->
<div class="modal-overlay" id="photosModalOverlay">
  <div class="modal-box loki-photos-box">
    <button type="button" class="modal-close" id="closePhotosModal" aria-label="Close"><i data-icon="x"></i></button>
    <h3>Photos</h3>
    <p class="modal-sub">Uploaded with this message.</p>
    <div class="modal-scroll-content loki-photos-scroll" id="photosScroll"></div>
  </div>
</div>

<!-- ===== Reply modal ===== -->
<div class="modal-overlay" id="replyModalOverlay">
  <div class="modal-box">
    <button type="button" class="modal-close" id="closeReplyModal" aria-label="Close"><i data-icon="x"></i></button>
    <h3>Reply to message</h3>
    <p class="modal-sub" id="replyModalSub">&mdash;</p>
    <form id="replyForm" class="message-form">
      <label for="replyTextarea">Your reply</label>
      <textarea id="replyTextarea" rows="10" placeholder="Type your reply here (up to about 1000 words)..."></textarea>
      <span class="form-hint" id="replyWordCount">0 / 1000 words</span>
      <button type="submit" class="btn btn-primary btn-block btn-lg">Send Reply</button>
      <p class="form-status" id="replyFormStatus" aria-live="polite"></p>
    </form>
  </div>
</div>

<script src="assets/js/loki.js"></script>
</body>
</html>
